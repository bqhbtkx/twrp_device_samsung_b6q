name: Build TWRP for SM-F741B (b6q)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize disk space and add swap
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          if [ -d /mnt ] && [ "$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')" -ge 50 ]; then
            echo "BUILD_ROOT=/mnt/twrp" >> $GITHUB_ENV
            sudo mkdir -p /mnt/twrp
            sudo chown -R $USER:$USER /mnt/twrp
            SWAP_PATH=/mnt/swapfile
          else
            echo "BUILD_ROOT=$GITHUB_WORKSPACE/twrp" >> $GITHUB_ENV
            mkdir -p "$GITHUB_WORKSPACE/twrp"
            SWAP_PATH=/swapfile
          fi
          if [ "$(free -m | awk '/^Swap:/ {print $2}')" -lt 8000 ]; then
            sudo fallocate -l 16G "$SWAP_PATH"
            sudo chmod 600 "$SWAP_PATH"
            sudo mkswap "$SWAP_PATH"
            sudo swapon "$SWAP_PATH"
          fi
          df -h
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python-is-python3 openjdk-17-jdk cpio
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: dt_b6q

      - name: Sync TWRP 14.1 source
        run: |
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          git config --global user.name "TWRP CI"
          git config --global user.email "ci@localhost"
          git config --global color.ui false
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14.1
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)

      - name: Place device tree
        run: |
          mkdir -p "$BUILD_ROOT/device/samsung"
          rm -rf "$BUILD_ROOT/device/samsung/b6q"
          cp -a "$GITHUB_WORKSPACE/dt_b6q" "$BUILD_ROOT/device/samsung/b6q"

      - name: Build TWRP recoveryimage
        run: |
          cd "$BUILD_ROOT"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          ls -la build/release/build_config/ || true
          if [ -f build/release/build_config/ap2a.scl ]; then
            REL_CFG=ap2a
          elif [ -f build/release/build_config/ap1a.scl ]; then
            REL_CFG=ap1a
          else
            REL_CFG=trunk_staging
          fi
          echo "Using release config: $REL_CFG"
          lunch "twrp_b6q-${REL_CFG}-eng"
          mka recoveryimage -j$(nproc)

      - name: Package Odin tars and vbmeta_disabled
        run: |
          OUT_DIR="$BUILD_ROOT/out/target/product/b6q"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$OUT_DIR/recovery.img" "$GITHUB_WORKSPACE/release/recovery.img"
          tar -H ustar -c -C "$OUT_DIR" -f "$GITHUB_WORKSPACE/release/twrp_b6q_F741BXXS2CYL5.tar" recovery.img

          # Generate vbmeta_disabled.img (flags=3: disable hashtree + verification)
          python3 "$BUILD_ROOT/external/avb/avbtool.py" make_vbmeta_image \
            --flags 3 --padding_size 4096 \
            --output "$GITHUB_WORKSPACE/release/vbmeta.img"
          tar -H ustar -c -C "$GITHUB_WORKSPACE/release" -f "$GITHUB_WORKSPACE/release/vbmeta_disabled_b6q.tar" vbmeta.img
          ls -lh "$GITHUB_WORKSPACE/release"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-b6q-F741BXXS2CYL5
          path: release/*
